server:
  # Cloud Run provides PORT=8080. Local development still defaults to 8081 to
  # avoid clashing with another service already bound to 8080.
  port: ${SERVER_PORT:${PORT:8081}}

spring:
  application:
    name: ticketing

  # Defaults match docker-compose.yml, so `./mvnw spring-boot:run` works with no
  # .env exported. Cloud Run can provide DATABASE_URL plus DATABASE_USERNAME /
  # DATABASE_PASSWORD; TicketingApplication converts those before Spring starts.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ticketflow1_ticketing}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:ticketflow1}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:ticketflow1}}

  jpa:
    # Schema truth lives in Flyway. Hibernate only validates that entities match
    # the migrated schema at startup — it never creates or alters tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

# App-specific config (bound in Phase 1 Step 4 by JwtService)
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 8
  attachments:
    # Keep request buffering and disk exhaustion bounded; deployments may raise
    # this deliberately through ATTACHMENT_MAX_SIZE_BYTES if business needs it.
    max-size-bytes: ${ATTACHMENT_MAX_SIZE_BYTES:26214400}
    storage-directory: ${ATTACHMENT_STORAGE_DIRECTORY:./data/attachments}
    allowed-content-types: ${ATTACHMENT_ALLOWED_CONTENT_TYPES:application/pdf,text/plain,text/csv,image/png,image/jpeg,image/gif,image/webp,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    # HTTPS deployments keep this enabled. Plain-HTTP local development opts out.
    secure-cookies: ${COOKIE_SECURE:false}
    login-rate-limit:
      # Failed password attempts per email address before a temporary block.
      max-failures: ${APP_LOGIN_MAX_FAILURES:5}
      window-seconds: ${APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
  dev-logging:
    enabled: ${APP_DEV_LOGGING_ENABLED:true}
    slow-request-ms: ${APP_DEV_LOGGING_SLOW_REQUEST_MS:1000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    com.ticketflow1.ticketing: ${APP_LOG_LEVEL:INFO}

springdoc:
  # API documentation is useful locally but should not disclose endpoints in a
  # public deployment unless operators opt in.
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_API_DOCS_ENABLED:false}
